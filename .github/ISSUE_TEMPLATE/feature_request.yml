name: Feature request
description: Ask for something the tool does not do yet
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README first — this is a detection tool by design: regex
        patterns plus an optional entropy check. It does not fix secrets,
        rotate keys, or block a commit on its own outside the documented
        pre-commit hook example. If your request needs one of those, say what
        problem it solves; it may still be a good fit as an add-on, not a
        change to the core scan.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: The situation, not the feature. The feature you are asking for may not be the right answer.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: What you run now, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Anything this should not break
